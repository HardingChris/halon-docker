{{- if .Values.global.policyd.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "policyd.fullname" . }}
  labels:
    {{- include "policyd.labels" . | nindent 4 }}
data:
  policyd.yaml: |
{{ tpl (.Files.Get "src/config/policyd.yaml") . | nindent 4 }}
  policyd-app.yaml: |
{{ tpl (.Files.Get "src/config/policyd-app.yaml") . | nindent 4 }}
{{- end }}
