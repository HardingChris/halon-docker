version: "6.10"
servers:
  - id: default
    transport: mx
    phases:
      eod:
        hook: default
transportgroups:
  - id: default
    retry:
      count: 30
      intervals:
        - interval: 60
        - interval: 900
        - interval: 3600
          notify: true
        - interval: 7200
        - interval: 10800
    dsn:
      transport: mx
    transports:
      - id: mx
        {{- if .Values.relayOverride.enabled }}
        connection:
          server: {{ required "relayOverride.host is required when enabled" .Values.relayOverride.host | quote }}
          port: {{ .Values.relayOverride.port }}
        {{- end }}
        session:
          tls:
            {{- if .Values.relayOverride.enabled }}
            mode: {{ .Values.relayOverride.tlsMode }}
            {{- else }}
            mode: dane
            {{- end }}
resolver:
  cache:
    size: 10000
queues:
  pooling:
    size: 1000
    policy: grouping
  grouping:
    default: recipientdomain
plugins: {{- if and (not .Values.global.rated.enabled) (not .Values.global.dlpd.enabled) }} []{{- end }}
  {{- if .Values.global.rated.enabled }}
  - id: rate
    config:
      port: {{ .Values.global.rated.service.port }}
      address: "{{ .Release.Name }}-rated.{{ .Release.Namespace }}.svc.cluster.local"
  {{- end }}
  {{- if .Values.global.dlpd.enabled }}
  - id: dlp
    config:
      port: {{ .Values.global.dlpd.service.port }}
      address: "{{ .Release.Name }}-dlpd.{{ .Release.Namespace }}.svc.cluster.local"
  {{- end }}
