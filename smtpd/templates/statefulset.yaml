{{- if .Values.global.smtpd.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "smtpd.fullname" . }}
  labels:
    {{- include "smtpd.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "smtpd.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "smtpd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with (include "smtpd.podAnnotations" . | fromYaml) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "smtpd.labels" . | nindent 8 }}
        {{- with (include "smtpd.podLabels" . | fromYaml) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smtpd.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $root := . }}
      {{- $hookSubfolders := list "eod" "auth" "connect" "disconnect" "helo" "mailfrom" "proxy" "queue" "rcptto" }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: {{ .Values.global.smtpd.service.port }}
              protocol: TCP
            - name: prometheus
              containerPort: {{ .Values.readinessProbe.httpGet.port }}
              protocol: TCP
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spool
              mountPath: /var/spool/halon/queue
            - name: src-config
              mountPath: /src/config
{{- range $hook := $hookSubfolders }}
            - name: src-hooks-{{ $hook }}
              mountPath: /src/hooks/{{ $hook }}
{{- end }}
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.global.smtpd.api.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.global.smtpd.api.service.port }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: src-config
              mountPath: /etc/halon
      volumes:
        - name: src-config
          configMap:
            name: {{ include "smtpd.fullname" . }}-config
{{- range $hook := $hookSubfolders }}
        - name: src-hooks-{{ $hook }}
          configMap:
            name: {{ include "smtpd.fullname" $root }}-hooks-{{ $hook }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storage }}
{{- end }}