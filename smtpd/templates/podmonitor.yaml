{{- if .Values.global.smtpd.prometheus.enabled }}
apiVersion: {{ .Values.prometheus.apiVersion }}
kind: PodMonitor
metadata:
  name: {{ include "smtpd.fullname" . }}
  labels:
    {{- include "smtpd.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.prometheus.apiVersion "azmonitoring.coreos.com/v1" }}
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  {{- end }}
  selector:
    matchLabels:
      {{- include "smtpd.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
{{- end }}