image:
  repository: halon/smtpd
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

api:
  image:
    repository: halon/api
    pullPolicy: Never
    # Overrides the image tag whose default is the chart appVersion.
    tag: "6.10.0"
  resources: {}

imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

istio:
  # Opt smtpd pods into the Istio service mesh.
  enabled: false
  # Istio control plane revision to inject from (AKS add-on revisions look like "asm-1-24").
  # Leave empty to rely on namespace-level injection labels.
  revision: ""
  # Outbound ports the sidecar must not capture, so the traffic egresses straight out of the
  # node subnet via the NAT gateway instead of through the mesh.
  excludeOutboundPorts: "25"
  # Inbound ports the sidecar must not capture.
  excludeInboundPorts: ""
  # CIDRs excluded from outbound capture, e.g. "0.0.0.0/0" to bypass the mesh entirely.
  excludeOutboundIPRanges: ""
  # Extra sidecar annotations, e.g. proxy.istio.io/config overrides.
  podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

readinessProbe:
  httpGet:
    path: /healthy
    port: 8080

nodeSelector: {}

tolerations: []

affinity: {}

replicaCount: 1
controlSocketPort: 5000
storage: 10Gi
storageClassName: ""
terminationGracePeriodSeconds: 600
