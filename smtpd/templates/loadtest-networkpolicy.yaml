{{- if and .Values.global.smtpd.enabled .Values.relayOverride.enabled .Values.relayOverride.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "smtpd.fullname" . }}-loadtest-egress
spec:
  podSelector:
    matchLabels:
      {{- include "smtpd.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.relayOverride.networkPolicy.sinkNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.relayOverride.networkPolicy.sinkRelease | quote }}
              app.kubernetes.io/component: sink
      ports:
        - {protocol: TCP, port: 25}
        - {protocol: TCP, port: 2525}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 2530}
        - {protocol: TCP, port: 2531}
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 5000}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-stack
      ports:
        - {protocol: TCP, port: 9200}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aks-istio-system
      ports:
        - {protocol: TCP, port: 15012}
{{- end }}