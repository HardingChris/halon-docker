apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.halon.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: smtpd
              app.kubernetes.io/instance: {{ .Values.halon.release | quote }}
      ports:
        - {protocol: TCP, port: 2525}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: TCP, port: 9090}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.halon.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: smtpd
              app.kubernetes.io/instance: {{ .Values.halon.release | quote }}
      ports:
        - {protocol: TCP, port: 25}